<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMV Bookstores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 820px;
      margin: 2.5rem auto;
      padding: 0 1.25rem 3.5rem;
      color: #18181b;
      background: #ffffff;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    header {
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #111827;
    }

    .subtitle {
      color: #52525b;
      margin: 0;
      font-size: 1rem;
    }

    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .map-toolbar-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #52525b;
    }

    .style-buttons {
      display: inline-flex;
      border: 1px solid #d4d4d8;
      border-radius: 6px;
      overflow: hidden;
      background: #fafafa;
    }

    .style-btn {
      appearance: none;
      border: none;
      border-right: 1px solid #d4d4d8;
      background: transparent;
      color: #27272a;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .style-btn:last-child {
      border-right: none;
    }

    .style-btn:hover {
      background: #f4f4f5;
    }

    .style-btn[aria-pressed="true"] {
      background: #18181b;
      color: #ffffff;
    }

    #map {
      height: 380px;
      margin-bottom: 0.6rem;
      border: 1px solid #e4e4e7;
      border-radius: 6px;
      background: #f4f4f5;
    }

    .map-notice {
      font-size: 0.8rem;
      color: #71717a;
      margin-bottom: 1.5rem;
      min-height: 1.1em;
    }

    .leaflet-container {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .jump-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding: 0.75rem 0.85rem;
      margin-bottom: 1.75rem;
      background: #fafafa;
      border: 1px solid #e4e4e7;
      border-radius: 6px;
    }

    .jump-link {
      display: inline-block;
      padding: 0.28rem 0.6rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: #27272a;
      background: #ffffff;
      border: 1px solid #d4d4d8;
      border-radius: 999px;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .jump-link:hover {
      background: #18181b;
      border-color: #18181b;
      color: #ffffff;
    }

    .region-group {
      margin-top: 2.25rem;
      scroll-margin-top: 1.25rem;
    }

    .region-heading {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #111827;
      margin: 0 0 0.5rem;
      padding-bottom: 0.45rem;
      border-bottom: 2px solid #18181b;
    }

    .store {
      padding: 1rem 0;
      border-bottom: 1px solid #e4e4e7;
    }

    .store:last-child {
      border-bottom: none;
    }

    .store h2 {
      margin: 0 0 0.2rem;
      font-size: 1.08rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #111827;
    }

    .store-title-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .store-title-btn:hover {
      text-decoration: underline;
    }

    .meta {
      font-size: 0.85rem;
      color: #71717a;
      margin-bottom: 0.45rem;
    }

    .store p {
      margin: 0 0 0.5rem;
      font-size: 0.95rem;
      color: #27272a;
    }

    .links {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .links a {
      margin-right: 1rem;
      color: #1d4ed8;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .status {
      color: #71717a;
      font-size: 0.95rem;
    }

    .error-box {
      padding: 0.85rem 1rem;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #991b1b;
      border-radius: 6px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>DMV Bookstores</h1>
    <p class="subtitle">Independent bookstores across Washington, D.C., Maryland, and Northern Virginia.</p>
  </header>

  <div class="map-toolbar">
    <span class="map-toolbar-label">Map style</span>
    <div class="style-buttons" role="group" aria-label="Map style switcher">
