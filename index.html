<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMV Bookstores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 820px;
      margin: 2.5rem auto;
      padding: 0 1.25rem 3.5rem;
      color: #18181b;
      background: #ffffff;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    header {
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #111827;
    }

    .subtitle {
      color: #52525b;
      margin: 0;
      font-size: 1rem;
    }

    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .map-toolbar-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #52525b;
    }

    .style-buttons {
      display: inline-flex;
      border: 1px solid #d4d4d8;
      border-radius: 6px;
      overflow: hidden;
      background: #fafafa;
    }

    .style-btn {
      appearance: none;
      border: none;
      border-right: 1px solid #d4d4d8;
      background: transparent;
      color: #27272a;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .style-btn:last-child {
      border-right: none;
    }

    .style-btn:hover {
      background: #f4f4f5;
    }

    .style-btn[aria-pressed="true"] {
      background: #18181b;
      color: #ffffff;
    }

    #map {
      height: 380px;
      margin-bottom: 0.6rem;
      border: 1px solid #e4e4e7;
      border-radius: 6px;
      background: #f4f4f5;
    }

    .map-notice {
      font-size: 0.8rem;
      color: #71717a;
      margin-bottom: 1.5rem;
      min-height: 1.1em;
    }

    .leaflet-container {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .jump-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding: 0.75rem 0.85rem;
      margin-bottom: 1.75rem;
      background: #fafafa;
      border: 1px solid #e4e4e7;
      border-radius: 6px;
    }

    .jump-link {
      display: inline-block;
      padding: 0.28rem 0.6rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: #27272a;
      background: #ffffff;
      border: 1px solid #d4d4d8;
      border-radius: 999px;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .jump-link:hover {
      background: #18181b;
      border-color: #18181b;
      color: #ffffff;
    }

    .region-group {
      margin-top: 2.25rem;
      scroll-margin-top: 1.25rem;
    }

    .region-heading {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #111827;
      margin: 0 0 0.5rem;
      padding-bottom: 0.45rem;
      border-bottom: 2px solid #18181b;
    }

    .empty-region {
      padding: 0.85rem 0;
      color: #71717a;
      font-size: 0.9rem;
    }

    .store {
      padding: 1rem 0;
      border-bottom: 1px solid #e4e4e7;
    }

    .store:last-child {
      border-bottom: none;
    }

    .store h2 {
      margin: 0 0 0.2rem;
      font-size: 1.08rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #111827;
    }

    .store-title-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .store-title-btn:hover {
      text-decoration: underline;
    }

    .meta {
      font-size: 0.85rem;
      color: #71717a;
      margin-bottom: 0.45rem;
    }

    .store p {
      margin: 0 0 0.5rem;
      font-size: 0.95rem;
      color: #27272a;
    }

    .links {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .links a {
      margin-right: 1rem;
      color: #1d4ed8;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .status {
      color: #71717a;
      font-size: 0.95rem;
    }

    .error-box {
      padding: 0.85rem 1rem;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: #991b1b;
      border-radius: 6px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>DMV Bookstores</h1>
    <p class="subtitle">Independent bookstores across Washington, D.C., Maryland, and Northern Virginia.</p>
  </header>

  <div class="map-toolbar">
    <span class="map-toolbar-label">Map style</span>
    <div class="style-buttons" role="group" aria-label="Map style switcher">
      <button type="button" class="style-btn" data-style="rastertiles/voyager" aria-pressed="true">Voyager</button>
      <button type="button" class="style-btn" data-style="light_all" aria-pressed="false">Positron</button>
      <button type="button" class="style-btn" data-style="dark_all" aria-pressed="false">Dark Matter</button>
    </div>
  </div>
  <div id="map"></div>
  <div id="mapNotice" class="map-notice"></div>
  <div id="list" class="status">Loading bookstores...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJNe2Q3nsS690lAyyXttzpF0sOUs6w3MH6yqsrzM2OB0v9nE-V8HDHg2qiLHLt0PPWwUOU0f-JZzgr/pub?output=csv";
    const CARTO_API_KEY = "cb1_5e2t_1_7d78e49b01374bdc84b7b14c";
    const DC_BOUNDARY_GEOJSON_URL = "https://maps2.dcgis.dc.gov/dcgis/rest/services/DCGIS_DATA/Administrative_Other_Boundaries_WebMercator/MapServer/10/query?where=1%3D1&outFields=*&outSR=4326&f=geojson";

    // Query DMV bounding box on USA_Census_Counties so field names or GEOID types don't cause empty results
    const SURROUNDING_GEOJSON_URL = "https://services.arcgis.com/P3ePLMYs2RVChkJx/ArcGIS/rest/services/USA_Census_Counties/FeatureServer/0/query?where=1%3D1&geometry=-77.45%2C38.75%2C-76.65%2C39.35&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&outSR=4326&f=geojson";

    const TARGET_COUNTY_GEOIDS = new Set(["24031", "24033", "51013", "51510"]);
    const TARGET_COUNTY_NAMES = new Set([
      "MONTGOMERY",
      "PRINCE GEORGE'S",
      "PRINCE GEORGES",
      "ARLINGTON",
      "ALEXANDRIA"
    ]);

    const HEADING_ORDER = [
      "DC - NE",
      "DC - NW",
      "DC - SE",
      "DC - SW",
      "MD - Montgomery County",
      "MD - Prince Georges County",
      "VA - Alexandria",
      "VA - Arlington"
    ];

    const PG_PLACES = [
      "HYATTSVILLE",
      "COLLEGE PARK",
      "GREENBELT",
      "LAUREL",
      "BOWIE",
      "RIVERDALE",
      "MOUNT RAINIER",
      "MT RAINIER",
      "BLADENSBURG",
      "BERWYN HEIGHTS",
      "NEW CARROLLTON",
      "LANHAM",
      "LARGO",
      "UPPER MARLBORO",
      "FORT WASHINGTON",
      "OXON HILL",
      "TEMPLE HILLS",
      "SUITLAND",
      "DISTRICT HEIGHTS",
      "CAPITOL HEIGHTS",
      "CHEVERLY",
      "EDMONSTON",
      "BRENTWOOD",
      "ADELPHI"
    ];

    const MOCO_PLACES = [
      "BETHESDA",
      "SILVER SPRING",
      "ROCKVILLE",
      "CHEVY CHASE",
      "KENSINGTON",
      "GAITHERSBURG",
      "GERMANTOWN",
      "POTOMAC",
      "WHEATON",
      "TAKOMA PARK",
      "OLNEY",
      "CABIN JOHN",
      "GARRETT PARK",
      "SOMERSET",
      "GLEN ECHO"
    ];

    const ALEXANDRIA_PLACES = [
      "ALEXANDRIA",
      "OLD TOWN",
      "DEL RAY",
      "CARLYLE",
      "EISENHOWER",
      "POTOMAC YARD",
      "BRADDOCK",
      "PARKFAIRFAX",
      "ROSEMOUNT",
      "BEVERLY HILLS",
      "SEMINARY",
      "WEST END"
    ];

    const ARLINGTON_PLACES = [
      "ARLINGTON",
      "ROSSLYN",
      "BALLSTON",
      "CLARENDON",
      "VIRGINIA SQUARE",
      "COURT HOUSE",
      "PENTAGON CITY",
      "CRYSTAL CITY",
      "SHIRLINGTON",
      "COLUMBIA PIKE",
      "LYON VILLAGE",
      "ASHTON HEIGHTS",
      "CHERRYDALE",
      "BARCROFT",
      "FAIRLINGON",
      "FAIR LINGTON"
    ];

    function getField(row, ...candidates) {
      if (!row || typeof row !== "object") return "";
      const keys = Object.keys(row);
      for (const candidate of candidates) {
        const target = candidate.trim().toLowerCase();
        const match = keys.find(k => k.trim().toLowerCase() === target);
        if (match !== undefined && row[match] !== undefined && row[match] !== null) {
          const val = String(row[match]).trim();
          if (val !== "") return val;
        }
      }
      return "";
    }

    const listEl = document.getElementById("list");
    const mapNoticeEl = document.getElementById("mapNotice");
    const boundaryIssues = [];

    function updateBoundaryNotice() {
      if (boundaryIssues.length > 0) {
        mapNoticeEl.textContent = "Boundary note: " + boundaryIssues.join(" · ");
      } else {
        mapNoticeEl.textContent = "";
      }
    }

    function showListError(message) {
      listEl.className = "error-box";
      listEl.textContent = message;
    }

    window.addEventListener("error", (event) => {
      if (listEl && listEl.textContent === "Loading bookstores...") {
        showListError("Script error: " + (event.message || "Unable to initialize page."));
      }
    });

    function slugifyHeading(heading) {
      return "region-" + heading
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function normalizeHeading(store) {
      const rawQuadrant = getField(store, "quadrant", "region", "area", "jurisdiction", "county");
      const q = rawQuadrant
        .trim()
        .toUpperCase()
        .replace(/’/g, "'")
        .replace(/\s+/g, " ");

      const neighborhood = getField(store, "neighborhood", "hood", "city", "town");
      const address = getField(store, "address", "street_address", "street address", "location");
      const locationText = [neighborhood, address]
        .join(" ")
        .toUpperCase()
        .replace(/’/g, "'");

      const lat = parseFloat(getField(store, "lat", "latitude"));
      const lng = parseFloat(getField(store, "lng", "lon", "long", "longitude"));
      const hasCoords = !isNaN(lat) && !isNaN(lng);

      if (q === "NE" || q === "NE DC" || q === "DC - NE" || q === "DC-NE") return "DC - NE";
      if (q === "NW" || q === "NW DC" || q === "DC - NW" || q === "DC-NW") return "DC - NW";
      if (q === "SE" || q === "SE DC" || q === "DC - SE" || q === "DC-SE") return "DC - SE";
      if (q === "SW" || q === "SW DC" || q === "DC - SW" || q === "DC-SW") return "DC - SW";

      if (
        q.includes("MONTGOMERY") ||
        q === "MOCO" ||
        q === "MD - MONTGOMERY COUNTY" ||
        q === "MD - MONTGOMERY"
      ) {
        return "MD - Montgomery County";
      }

      if (
        q.includes("PRINCE GEORGE") ||
        q === "PG" ||
        q === "PG COUNTY" ||
        q === "PRINCE GEORGES" ||
        q === "PRINCE GEORGE'S" ||
        q === "MD - PRINCE GEORGES COUNTY" ||
        q === "MD - PRINCE GEORGE'S COUNTY"
      ) {
        return "MD - Prince Georges County";
      }

      if (q.includes("ALEXANDRIA") || q === "VA - ALEXANDRIA") {
        return "VA - Alexandria";
      }

      if (q.includes("ARLINGTON") || q === "VA - ARLINGTON") {
        return "VA - Arlington";
      }

      if (q === "MD" || q === "MARYLAND") {
        if (locationText.includes("PRINCE GEORGE") || PG_PLACES.some(place => locationText.includes(place))) {
          return "MD - Prince Georges County";
        }
        if (locationText.includes("MONTGOMERY") || MOCO_PLACES.some(place => locationText.includes(place))) {
          return "MD - Montgomery County";
        }
        if (hasCoords) {
          return lng > -77.01 ? "MD - Prince Georges County" : "MD - Montgomery County";
        }
        return "MD - Prince Georges County";
      }

      if (q === "VA" || q === "VIRGINIA") {
        if (ALEXANDRIA_PLACES.some(place => locationText.includes(place))) {
          return "VA - Alexandria";
        }
        if (ARLINGTON_PLACES.some(place => locationText.includes(place))) {
          return "VA - Arlington";
        }
        if (hasCoords) {
          return lat < 38.835 ? "VA - Alexandria" : "VA - Arlington";
        }
        return "VA - Arlington";
      }

      return "DC - NW";
    }

    const map = L.map("map", {
      zoomControl: true,
      scrollWheelZoom: false
    }).setView([38.9072, -77.0369], 11);

    let activeTileLayer = null;
    let dcBoundaryLayer = null;
    let surroundingBoundaryLayer = null;
    let tileErrors = 0;

    function getDcBoundaryStyle(stylePath) {
      if (stylePath === "dark_all") {
        return {
          color: "#d1d5db",
          weight: 2.5,
          opacity: 0.9,
          fill: false,
          interactive: false
        };
      }
      return {
        color: "#374151",
        weight: 2.5,
        opacity: 0.9,
        fill: false,
        interactive: false
      };
    }

    function getSurroundingBoundaryStyle(stylePath) {
      if (stylePath === "dark_all") {
        return {
          color: "#6b7280",
          weight: 1.5,
          opacity: 0.75,
          fill: false,
          interactive: false
        };
      }
      return {
        color: "#9ca3af",
        weight: 1.5,
        opacity: 0.85,
        fill: false,
        interactive: false
      };
    }

    function createCartoLayer(stylePath) {
      tileErrors = 0;
      updateBoundaryNotice();
      const layer = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${stylePath}/{z}/{x}/{y}{r}.png?key=${CARTO_API_KEY}`, {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a> | Boundaries: Open Data DC &amp; U.S. Census',
        subdomains: "abcd",
        maxZoom: 20
      });
      layer.on("tileerror", () => {
        tileErrors += 1;
        if (tileErrors >= 3) {
          mapNoticeEl.textContent = "Some map tiles could not load—check your CARTO API key or domain restrictions.";
        }
      });
      return layer;
    }

    function syncBoundaryLayers(stylePath) {
      if (surroundingBoundaryLayer) {
        surroundingBoundaryLayer.setStyle(getSurroundingBoundaryStyle(stylePath));
        surroundingBoundaryLayer.bringToBack();
      }
      if (dcBoundaryLayer) {
        dcBoundaryLayer.setStyle(getDcBoundaryStyle(stylePath));
        dcBoundaryLayer.bringToFront();
      }
    }

    function getActiveStylePath() {
      const currentBtn = document.querySelector('.style-btn[aria-pressed="true"]');
      return currentBtn ? currentBtn.dataset.style : "rastertiles/voyager";
    }

    function setMapStyle(stylePath) {
      if (activeTileLayer) {
        map.removeLayer(activeTileLayer);
      }
      activeTileLayer = createCartoLayer(stylePath);
      activeTileLayer.addTo(map);
      syncBoundaryLayers(stylePath);

      document.querySelectorAll(".style-btn").forEach(btn => {
        btn.setAttribute("aria-pressed", btn.dataset.style === stylePath ? "true" : "false");
      });
    }

    setMapStyle("rastertiles/voyager");

    function fetchJsonWithTimeout(url, timeoutMs = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { signal: controller.signal })
        .then(res => {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .finally(() => clearTimeout(timer));
    }

    function isTargetSurroundingFeature(feature) {
      const props = (feature && feature.properties) || {};
      const geoid = String(getField(props, "GEOID", "FIPS", "STATE_COUNTY_FIPS") || "").trim();
      if (TARGET_COUNTY_GEOIDS.has(geoid)) return true;

      const name = String(getField(props, "NAME", "COUNTY_NAME", "NAMELSAD") || "")
        .trim()
        .toUpperCase()
        .replace(/’/g, "'")
        .replace(/\s+(COUNTY|CITY)$/i, "");
      const state = String(getField(props, "STATE_NAME", "STATE", "STUSPS") || "")
        .trim()
        .toUpperCase();

      const isMdOrVa = state === "MD" || state === "MARYLAND" || state === "VA" || state === "VIRGINIA";
      return isMdOrVa && TARGET_COUNTY_NAMES.has(name);
    }

    fetchJsonWithTimeout(SURROUNDING_GEOJSON_URL)
      .then(geojson => {
        if (!geojson || !Array.isArray(geojson.features) || geojson.features.length === 0) {
          throw new Error("Empty features");
        }
        const filteredFeatures = geojson.features.filter(isTargetSurroundingFeature);
        const featuresToDraw = filteredFeatures.length > 0 ? filteredFeatures : geojson.features;
        surroundingBoundaryLayer = L.geoJSON({ type: "FeatureCollection", features: featuresToDraw }, {
          style: () => getSurroundingBoundaryStyle(getActiveStylePath()),
          interactive: false
        }).addTo(map);
        syncBoundaryLayers(getActiveStylePath());
      })
      .catch(err => {
        boundaryIssues.push("County outlines unavailable (" + err.message + ")");
        updateBoundaryNotice();
      });

    fetchJsonWithTimeout(DC_BOUNDARY_GEOJSON_URL)
      .then(geojson => {
        if (!geojson || !Array.isArray(geojson.features) || geojson.features.length === 0) {
          throw new Error("Empty features");
        }
        dcBoundaryLayer = L.geoJSON(geojson, {
          style: () => getDcBoundaryStyle(getActiveStylePath()),
          interactive: false
        }).addTo(map);
        syncBoundaryLayers(getActiveStylePath());
      })
      .catch(err => {
        boundaryIssues.push("D.C. outline unavailable (" + err.message + ")");
        updateBoundaryNotice();
      });

    document.querySelectorAll(".style-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        setMapStyle(btn.dataset.style);
      });
    });

    const markers = [];

    function renderDirectory(csvText) {
      const parsed = Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true
      });

      if (parsed.errors && parsed.errors.length > 0 && (!parsed.data || parsed.data.length === 0)) {
        showListError("Could not parse CSV data: " + parsed.errors[0].message);
        return;
      }

      const stores = (parsed.data || []).filter(r => getField(r, "name", "store", "bookstore", "title"));
      if (stores.length === 0) {
        showListError("Spreadsheet loaded, but no bookstore rows with a name column were found.");
        return;
      }

      listEl.innerHTML = "";
      listEl.className = "";

      const grouped = {};
      HEADING_ORDER.forEach(h => {
        grouped[h] = [];
      });

      stores.forEach(store => {
        const name = getField(store, "name", "store", "bookstore", "title");
        const address = getField(store, "address", "street_address", "street address", "location");
        const neighborhood = getField(store, "neighborhood", "hood", "city", "town");
        const description = getField(store, "description", "notes", "about");
        const website = getField(store, "website", "url", "link");
        const lat = parseFloat(getField(store, "lat", "latitude"));
        const lng = parseFloat(getField(store, "lng", "lon", "long", "longitude"));

        const heading = normalizeHeading(store);
        grouped[heading].push({
          ...store,
          _name: name,
          _address: address,
          _neighborhood: neighborhood,
          _description: description,
          _website: website
        });

        let marker = null;
        if (!isNaN(lat) && !isNaN(lng)) {
          marker = L.marker([lat, lng])
            .addTo(map)
            .bindPopup(`<strong>${name}</strong><br>${address}`);
          markers.push({ lat, lng, marker });
        }

        const entry = grouped[heading][grouped[heading].length - 1];
        entry._marker = marker;
        entry._lat = lat;
        entry._lng = lng;
      });

      if (markers.length > 0) {
        const bounds = L.latLngBounds(markers.map(m => [m.lat, m.lng]));
        map.fitBounds(bounds, { padding: [24, 24] });
      }

      const jumpNav = document.createElement("nav");
      jumpNav.className = "jump-bar";
      jumpNav.setAttribute("aria-label", "Jump to region heading");

      HEADING_ORDER.forEach(heading => {
        const link = document.createElement("a");
        link.className = "jump-link";
        link.href = "#" + slugifyHeading(heading);
        link.textContent = heading;
        jumpNav.appendChild(link);
      });

      listEl.appendChild(jumpNav);

      HEADING_ORDER.forEach(heading => {
        const groupStores = grouped[heading].sort((a, b) =>
          a._name.localeCompare(b._name, undefined, { sensitivity: "base" })
        );

        const section = document.createElement("section");
        section.className = "region-group";
        section.id = slugifyHeading(heading);

        const h2 = document.createElement("h2");
        h2.className = "region-heading";
        h2.textContent = heading;
        section.appendChild(h2);

        if (groupStores.length === 0) {
          const emptyMsg = document.createElement("p");
          emptyMsg.className = "empty-region";
          emptyMsg.textContent = "No bookstores listed in this area yet.";
          section.appendChild(emptyMsg);
          listEl.appendChild(section);
          return;
        }

        groupStores.forEach(store => {
          const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((store._name || "") + " " + (store._address || ""))}`;
          const item = document.createElement("article");
          item.className = "store";

          const titleHeading = document.createElement("h2");
          const titleBtn = document.createElement("button");
          titleBtn.type = "button";
          titleBtn.className = "store-title-btn";
          titleBtn.textContent = store._name;
          if (store._marker && !isNaN(store._lat) && !isNaN(store._lng)) {
            titleBtn.addEventListener("click", () => {
              map.setView([store._lat, store._lng], 15);
              store._marker.openPopup();
              document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "nearest" });
            });
          }
          titleHeading.appendChild(titleBtn);
          item.appendChild(titleHeading);

          const metaDiv = document.createElement("div");
          metaDiv.className = "meta";
          metaDiv.textContent = [store._neighborhood, store._address].filter(Boolean).join(" · ");
          item.appendChild(metaDiv);

          if (store._description) {
            const descP = document.createElement("p");
            descP.textContent = store._description;
            item.appendChild(descP);
          }

          const linksDiv = document.createElement("div");
          linksDiv.className = "links";
          linksDiv.innerHTML = `
            <a href="${mapsUrl}" target="_blank" rel="noopener">Google Maps</a>
            ${store._website ? `<a href="${store._website}" target="_blank" rel="noopener">Website</a>` : ""}
          `;
          item.appendChild(linksDiv);

          section.appendChild(item);
        });

        listEl.appendChild(section);
      });
    }

    fetch(SHEET_CSV_URL, { cache: "no-store" })
      .then(res => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(renderDirectory)
      .catch(err => {
        showListError("Unable to load spreadsheet data (" + err.message + ").");
      });
  </script>
</body>
</html>
