      text-decoration: none;

    .jump-link:hover {
      background: #18181b;

      color: #ffffff;
    }

      scroll-margin-top: 1.25rem;

      color: #111827;

      padding: 1rem 0;
      border-bottom: 1px solid #e4e4e7;

      border-bottom: none;
    }

    .store h2 {

      font-size: 1.08rem;

      font-size: 0.95rem;

    .links {

    .links a {
      margin-right: 1rem;
      color: #1d4ed8;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .status {
      color: #71717a;
      font-size: 0.95rem;
    }
  </style>
</head>

      if (q === "SE" || q === "SE DC" || q === "DC - SE" || q === "DC-SE") return "DC - SE";

        q === "MD - MONTGOMERY COUNTY" ||
        q === "MD - MONTGOMERY"

        q === "PG" ||
        q === "PG COUNTY" ||
        q === "PRINCE GEORGES" ||
        q === "PRINCE GEORGE'S" ||
        q === "MD - PRINCE GEORGES COUNTY" ||
