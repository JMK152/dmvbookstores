<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D.C. Bookstores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 820px;
      margin: 2.5rem auto;
      padding: 0 1.25rem 3.5rem;
      color: #18181b;
      background: #ffffff;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    header {
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #111827;
    }

    .subtitle {
      color: #52525b;
      margin: 0;
      font-size: 1rem;
    }

    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .map-toolbar-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #52525b;
    }

    .style-buttons {
      display: inline-flex;
      border: 1px solid #d4d4d8;
      border-radius: 6px;
      overflow: hidden;
      background: #fafafa;
    }

    .style-btn {
      appearance: none;
      border: none;
      border-right: 1px solid #d4d4d8;
      background: transparent;
      color: #27272a;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .style-btn:last-child {
      border-right: none;
    }

    .style-btn:hover {
      background: #f4f4f5;
    }

    .style-btn[aria-pressed="true"] {
      background: #18181b;
      color: #ffffff;
    }

    #map {
      height: 380px;
      margin-bottom: 2.25rem;
      border: 1px solid #e4e4e7;
      border-radius: 6px;
      background: #f4f4f5;
    }

    .leaflet-container {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .region-group {
      margin-top: 2.25rem;
    }

    .region-heading {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #111827;
      margin: 0 0 0.5rem;
      padding-bottom: 0.45rem;
      border-bottom: 2px solid #18181b;
    }

    .store {
      padding: 1rem 0;
      border-bottom: 1px solid #e4e4e7;
    }

    .store:last-child {
      border-bottom: none;
    }

    .store h2 {
      margin: 0 0 0.2rem;
      font-size: 1.08rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #111827;
    }

    .store-title-btn {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .store-title-btn:hover {
      text-decoration: underline;
    }

    .meta {
      font-size: 0.85rem;
      color: #71717a;
      margin-bottom: 0.45rem;
    }

    .store p {
      margin: 0 0 0.5rem;
      font-size: 0.95rem;
      color: #27272a;
    }

    .links {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .links a {
      margin-right: 1rem;
      color: #1d4ed8;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .status {
      color: #71717a;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>D.C. Bookstores</h1>
    <p class="subtitle">Independent bookstores in Washington, D.C. and bordering communities.</p>
  </header>

  <div class="map-toolbar">
    <span class="map-toolbar-label">Map style</span>
    <div class="style-buttons" role="group" aria-label="Map style switcher">
      <button type="button" class="style-btn" data-style="light_all" aria-pressed="true">Positron</button>
      <button type="button" class="style-btn" data-style="rastertiles/voyager" aria-pressed="false">Voyager</button>
      <button type="button" class="style-btn" data-style="dark_all" aria-pressed="false">Dark Matter</button>
    </div>
  </div>
  <div id="map"></div>
  <div id="list" class="status">Loading bookstores...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJNe2Q3nsS690lAyyXttzpF0sOUs6w3MH6yqsrzM2OB0v9nE-V8HDHg2qiLHLt0PPWwUOU0f-JZzgr/pub?output=csv";
    const CARTO_API_KEY = "cb1_5e2t_1_7d78e49b01374bdc84b7b14c";

    const HEADING_ORDER = [
      "NE DC",
      "NW DC",
      "SE DC",
      "SW DC",
      "Maryland",
      "Virginia"
    ];

    function normalizeHeading(quadrantValue) {
      const q = (quadrantValue || "").trim().toUpperCase();
      if (q === "NE" || q === "NE DC") return "NE DC";
      if (q === "NW" || q === "NW DC") return "NW DC";
      if (q === "SE" || q === "SE DC") return "SE DC";
      if (q === "SW" || q === "SW DC") return "SW DC";
      if (q === "MD" || q === "MARYLAND") return "Maryland";
      if (q === "VA" || q === "VIRGINIA") return "Virginia";
      return "NW DC";
    }

    const map = L.map("map", {
      zoomControl: true,
      scrollWheelZoom: false
    }).setView([38.9072, -77.0369], 12);

    let activeTileLayer = null;

    function createCartoLayer(stylePath) {
      return L.tileLayer(`https://{s}.basemaps.cartocdn.com/${stylePath}/{z}/{x}/{y}{r}.png?key=${CARTO_API_KEY}`, {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: "abcd",
        maxZoom: 20
      });
    }

    function setMapStyle(stylePath) {
      if (activeTileLayer) {
        map.removeLayer(activeTileLayer);
      }
      activeTileLayer = createCartoLayer(stylePath);
      activeTileLayer.addTo(map);

      document.querySelectorAll(".style-btn").forEach(btn => {
        btn.setAttribute("aria-pressed", btn.dataset.style === stylePath ? "true" : "false");
      });
    }

    setMapStyle("light_all");

    document.querySelectorAll(".style-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        setMapStyle(btn.dataset.style);
      });
    });

    const listEl = document.getElementById("list");
    const markers = [];

    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const stores = results.data.filter(r => r.name && r.name.trim());
        listEl.innerHTML = "";
        listEl.className = "";

        const grouped = {};
        HEADING_ORDER.forEach(h => {
          grouped[h] = [];
        });

        stores.forEach(store => {
          const heading = normalizeHeading(store.quadrant);
          grouped[heading].push(store);

          const lat = parseFloat(store.lat);
          const lng = parseFloat(store.lng);
          let marker = null;
          if (!isNaN(lat) && !isNaN(lng)) {
            marker = L.marker([lat, lng])
              .addTo(map)
              .bindPopup(`<strong>${store.name}</strong><br>${store.address || ""}`);
            markers.push({ lat, lng, marker });
          }
          store._marker = marker;
          store._lat = lat;
          store._lng = lng;
        });

        if (markers.length > 0) {
          const bounds = L.latLngBounds(markers.map(m => [m.lat, m.lng]));
          map.fitBounds(bounds, { padding: [24, 24] });
        }

        HEADING_ORDER.forEach(heading => {
          const groupStores = grouped[heading].sort((a, b) =>
            a.name.trim().localeCompare(b.name.trim(), undefined, { sensitivity: "base" })
          );

          if (groupStores.length === 0) return;

          const section = document.createElement("section");
          section.className = "region-group";

          const h2 = document.createElement("h2");
          h2.className = "region-heading";
          h2.textContent = heading;
          section.appendChild(h2);

          groupStores.forEach(store => {
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((store.name || "") + " " + (store.address || ""))}`;
            const item = document.createElement("article");
            item.className = "store";

            const titleHeading = document.createElement("h2");
            const titleBtn = document.createElement("button");
            titleBtn.type = "button";
            titleBtn.className = "store-title-btn";
            titleBtn.textContent = store.name;
            if (store._marker && !isNaN(store._lat) && !isNaN(store._lng)) {
              titleBtn.addEventListener("click", () => {
                map.setView([store._lat, store._lng], 15);
                store._marker.openPopup();
                document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "nearest" });
              });
            }
            titleHeading.appendChild(titleBtn);
            item.appendChild(titleHeading);

            const metaDiv = document.createElement("div");
            metaDiv.className = "meta";
            metaDiv.textContent = [store.neighborhood, store.address].filter(Boolean).join(" · ");
            item.appendChild(metaDiv);

            if (store.description) {
              const descP = document.createElement("p");
              descP.textContent = store.description;
              item.appendChild(descP);
            }

            const linksDiv = document.createElement("div");
            linksDiv.className = "links";
            linksDiv.innerHTML = `
              <a href="${mapsUrl}" target="_blank" rel="noopener">Google Maps</a>
              ${store.website ? `<a href="${store.website}" target="_blank" rel="noopener">Website</a>` : ""}
            `;
            item.appendChild(linksDiv);

            section.appendChild(item);
          });

          listEl.appendChild(section);
        });
      },
      error: function() {
        listEl.textContent = "Unable to load spreadsheet data.";
      }
    });
  </script>
</body>
</html>
